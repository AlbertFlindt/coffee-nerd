name: Image cleanup

# Keeps ghcr.io/<owner>/coffee-nerd to :latest (the newest stable release, also tagged :X.Y.Z),
# the pre-release GitHub lists (:X.Y.Z-pre) and the images of open pull requests. After each
# release run it deletes:
# - older releases and pre-releases: release.yml deletes a pre-release once there is a newer one
#   or the version is out, and its image goes with it;
# - commit images (sha-<commit>, the old :main, untagged) older than an hour, unless a kept release
#   points to them: release.yml tags a release as a manifest list that points to the sha-<commit>
#   image, so deleting that image would break the release. The hour leaves time for release.yml to
#   tag the newest one;
# - pull request images whose pull request is closed (pr-image-cleanup.yml can miss one when a pull
#   request is merged before its image is pushed).
# A pull request that changes this file runs it as a dry run: it lists what it would delete.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/image-cleanup.yml]

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: image-cleanup
  cancel-in-progress: false

jobs:
  prune:
    name: Delete images nobody runs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Delete old releases, commit images and closed pull request images
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          versions="/users/${{ github.repository_owner }}/packages/container/coffee-nerd/versions"
          gh api --paginate "$versions" \
            --jq '.[] | {id, digest: .name, created: .created_at, tags: .metadata.container.tags}' \
            > "$RUNNER_TEMP/versions.jsonl"
          echo "$(wc -l < "$RUNNER_TEMP/versions.jsonl") versions in the package."

          # Kept: :latest and the pre-releases GitHub still lists.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease) | .tagName | ltrimstr("v")] + ["latest"]' > "$RUNNER_TEMP/kept.json"
          defs='def kept: IN($kept[0][]);
            def release: test("^[0-9]+\\.[0-9]+\\.[0-9]+(-pre(\\.[0-9]+)?)?$");
            def build: startswith("sha-") or . == "main";'

          # Images a kept release's manifest list points to.
          : > "$RUNNER_TEMP/protected"
          for digest in $(jq -r --slurpfile kept "$RUNNER_TEMP/kept.json" "$defs"' select(any(.tags[]; kept)) | .digest' "$RUNNER_TEMP/versions.jsonl"); do
            docker buildx imagetools inspect --raw "$image@$digest" \
              | jq -r '.manifests[]?.digest' >> "$RUNNER_TEMP/protected"
          done

          cutoff=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          old=$(jq -r --arg cutoff "$cutoff" --slurpfile kept "$RUNNER_TEMP/kept.json" \
            --rawfile protected "$RUNNER_TEMP/protected" "$defs"'
            ($protected | split("\n")) as $keep
            | select((any(.tags[]; kept or startswith("pr-")) | not) and (.digest | IN($keep[]) | not)
              and (any(.tags[]; release) or (all(.tags[]; build) and .created < $cutoff)))
            | "\(.id) \(.tags | join(",") | if . == "" then "untagged" else . end)"' "$RUNNER_TEMP/versions.jsonl")

          closed=""
          while read -r id number; do
            [ -n "$id" ] || continue
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .state)" = closed ]; then
              closed+="$id pr-$number"$'\n'
            fi
          done < <(jq -r 'select(.tags | length == 1 and (.[0] | test("^pr-[0-9]+$"))) | "\(.id) \(.tags[0][3:])"' "$RUNNER_TEMP/versions.jsonl")

          deleted=0
          while read -r id tags; do
            [ -n "$id" ] || continue
            if [ "$DRY_RUN" = true ]; then
              echo "Would delete $tags (version $id)."
            else
              gh api --method DELETE "$versions/$id" && echo "Deleted $tags (version $id)."
            fi
            deleted=$((deleted + 1))
          done <<< "$old"$'\n'"$closed"
          echo "$deleted versions $([ "$DRY_RUN" = true ] && echo 'would be' || echo) deleted."
