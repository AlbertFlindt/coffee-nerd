name: Release

# After CI passes on main. A dated CHANGELOG section with no tag yet is a stable release: tag
# vX.Y.Z, publish it, and tag the image CI just pushed (ghcr.io/<owner>/coffee-nerd:sha-<commit>)
# as :X.Y.Z, :latest and :prerelease. An "(unreleased)" version whose app files changed since the
# last tag gets the next pre-release, vX.Y.Z-pre.N (a GitHub pre-release, so "latest" stays
# stable), and the image tags :X.Y.Z-pre.N and :prerelease. So :prerelease is always the newest
# release of either kind, and :latest the newest stable one.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Publish a stable release or a pre-release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node scripts/version.mjs check
          version=$(node scripts/version.mjs get)
          node scripts/version.mjs notes > "$RUNNER_TEMP/notes.md"
          if [ "$(node scripts/version.mjs state)" = stable ]; then
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "v$version is already released; nothing to do."; exit 0
            fi
            gh release create "v$version" --target "$SHA" \
              --title "Coffee Nerd $version" --notes-file "$RUNNER_TEMP/notes.md"
            echo "tags=$version latest prerelease" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 "$SHA" 2>/dev/null || true)
          app=$(git diff --name-only "$last" "$SHA" | grep -Ev '^(\.github/|\.claude/|docs/|tests/|[^/]+\.md$|LICENSE$|scripts/(version|docs-check)\.mjs$)' || true)
          if [ -z "$app" ]; then
            echo "No app changes since $last: no pre-release."; exit 0
          fi
          tag="$version-pre.$(( $(git tag -l "v$version-pre.*" | wc -l) + 1 ))"
          gh release create "v$tag" --target "$SHA" --prerelease \
            --title "Coffee Nerd $tag" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tags=$tag prerelease" >> "$GITHUB_OUTPUT"
      - name: Tag the image
        if: steps.release.outputs.tags
        env:
          TAGS: ${{ steps.release.outputs.tags }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          args=(); for tag in $TAGS; do args+=(--tag "$image:$tag"); done
          docker buildx imagetools create "${args[@]}" "$image:sha-${SHA::7}"
