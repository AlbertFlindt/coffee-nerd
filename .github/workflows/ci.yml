name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check, lint, test, build
    # Pinned with @playwright/test 1.56.1, whose --with-deps knows Ubuntu up to 24.04; upgrade both together.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag coffee-nerd:ci .
      - name: Container serves /health
        run: |
          docker run --detach --name coffee-nerd --publish 3000:3000 coffee-nerd:ci
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs coffee-nerd
          exit 1
      - name: First run, password reset and sign-in work in the container
        run: |
          post() { curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            -H 'Origin: http://localhost:3000' -H 'Accept: text/html' --data "$2" "http://localhost:3000$1"; }
          test "$(post /welcome 'name=Albert&password=old-password&repeat=old-password&timeZone=UTC')" = 303
          printf 'new-password\nnew-password\n' | docker exec -i coffee-nerd node scripts/reset-password.mjs
          test "$(post /login 'name=Albert&password=new-password')" = 303
          test "$(post /login 'name=Albert&password=old-password')" = 400
