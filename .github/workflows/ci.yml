name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its running checks. Runs on main are never cancelled: each
# merge publishes its own image, and release.yml turns each into its own pre-release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Check, lint, test, build
    # Pinned together with @playwright/test (1.63.0): its --with-deps must know this Ubuntu release; upgrade both together.
    runs-on: ubuntu-24.04
    # Room for three browser install tries that each wait out a stalled package lock (below).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: node scripts/docs-check.mjs
      - run: npm test
      - run: npm run build
      # The download or apt sometimes stalls without failing (three main runs so far): each try gets five minutes.
      - name: Install the Playwright browser
        run: |
          for try in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Try $try stalled or failed; trying again."
            # A try cut off leaves its apt-get running with the package lock: wait for it to finish.
            for wait in $(seq 36); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
              sleep 5
            done
          done
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag coffee-nerd:ci .
      - name: Container serves /health
        run: |
          docker run --detach --name coffee-nerd --publish 3000:3000 coffee-nerd:ci
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs coffee-nerd
          exit 1
      - name: First run, password reset and sign-in work in the container
        run: |
          post() { curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            -H 'Origin: http://localhost:3000' -H 'Accept: text/html' --data "$2" "http://localhost:3000$1"; }
          test "$(post /welcome 'name=Albert&password=old-password&repeat=old-password&timeZone=UTC')" = 303
          printf 'new-password\nnew-password\n' | docker exec -i coffee-nerd node scripts/reset-password.mjs
          test "$(post /login 'name=Albert&password=new-password')" = 303
          test "$(post /login 'name=Albert&password=old-password')" = 400
      - name: The image holds no sample setup, only the password reset script
        run: test "$(docker run --rm coffee-nerd:ci ls scripts)" = reset-password.mjs

  version:
    # Every merge that changes the app publishes a pre-release of the version on main, so such a
    # pull request needs a version above the latest stable one and a CHANGELOG entry for it.
    name: Version and changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a new version and a CHANGELOG entry when the app changes
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'
          # Docs, CI, end-to-end tests, the license and Claude Code files alone don't need a release.
          app=$(echo "$changed" | grep -Ev '^(\.github/|\.claude/|docs/|tests/|[^/]+\.md$|LICENSE$|scripts/(version|docs-check)\.mjs$)' || true)
          if [ -z "$app" ]; then
            echo "Only docs, CI or tests changed: no release needed."; exit 0
          fi
          node scripts/version.mjs check
          new=$(node scripts/version.mjs get)
          stable=$(git tag -l 'v*' | grep -v -- '-pre\.' | sed 's/^v//' | sort -V | tail -1)
          if [ "$new" = "$stable" ] || [ "$(printf '%s\n%s\n' "$stable" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "::error::Version $new is not above the latest stable $stable. Run node scripts/version.mjs bump X.Y.Z (see the release skill)."
            exit 1
          fi
          if ! echo "$changed" | grep -qx CHANGELOG.md; then
            echo "::error::This pull request changes the app but not CHANGELOG.md. Add an entry under '## $new'."
            exit 1
          fi
          if [ "$(node scripts/version.mjs state)" = stable ]; then
            echo "Will release $new as stable on merge (was $stable)."
          else
            echo "Will publish a $new pre-release on merge (latest stable: $stable)."
          fi

  publish:
    name: Publish image
    # Every merge to main becomes ghcr.io/<owner>/coffee-nerd:main (and :sha-<commit>, which the
    # release workflow tags as :X.Y.Z-pre.N, or as :X.Y.Z and :latest for a stable release).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --tag "$image:main" --tag "$image:sha-${GITHUB_SHA::7}" .
          docker push --all-tags "$image"

  publish-pr:
    name: Publish pull request image
    # Every pull request from this repository becomes ghcr.io/<owner>/coffee-nerd:pr-<number>, renewed
    # on each push once the tests pass, to try on a test server before merging (README, "Try a pull
    # request"). The build it replaces is deleted; pr-image-cleanup.yml deletes the last one when the
    # pull request is merged or closed.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [checks, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push, then delete the build it replaces
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          versions="/users/${{ github.repository_owner }}/packages/container/coffee-nerd/versions"
          tagged() { gh api --paginate "$versions" --jq ".[] | select(.metadata.container.tags | index(\"pr-$PR\")) | .id"; }
          before=$(tagged)
          docker build --tag "$image:pr-$PR" .
          docker push "$image:pr-$PR"
          if [ -n "$before" ] && [ "$before" != "$(tagged)" ]; then
            gh api --method DELETE "$versions/$before"
            echo "Deleted the previous pr-$PR build (version $before)."
          fi
