<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=412">
<title>40 · Gear — Archive a basket</title>
<!-- Exported from the Coffee Nerd UX canvas. Reference only: do not edit, re-export instead. -->
<style>
@font-face{font-family:'Figtree';font-weight:400;font-style:normal;font-display:block;src:url('fonts/figtree-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:500;font-style:normal;font-display:block;src:url('fonts/figtree-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:600;font-style:normal;font-display:block;src:url('fonts/figtree-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:700;font-style:normal;font-display:block;src:url('fonts/figtree-latin-700-normal.woff2') format('woff2')}

body{margin:0}
a{color:#E7A955}a:hover{color:#F2C78C}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#BFAE9F;opacity:1}

</style>
</head>
<body>
<div style="position: relative; width: 412px; height: 915px; overflow: hidden; background: #2E2522; font-family: 'Figtree', system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #F5EDE3">

  <div style="position: absolute; left: 0; top: 0; width: 412px; height: 915px">
    <div style="width: 412px; height: 915px; box-sizing: border-box; background: #2E2522; color: #F5EDE3; font-family: 'Figtree', system-ui, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column">

  <header style="display: grid; grid-template-columns: 48px 1fr auto; align-items: center; height: 60px; padding: 0 16px 0 8px">
    <a href="Equipment.dc.html" aria-label="Back to Gear" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F5EDE3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 600">Basket</h1>
    <span></span>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 12px; overflow: hidden">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px"><label for="f9" style="font-size: 12px; color: #BFAE9F">Brand</label></div>
      <input id="f9" value="IMS" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
    </div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px"><label for="f10" style="font-size: 12px; color: #BFAE9F">Size</label><span style="font-size: 12px; color: #BFAE9F">g</span></div>
      <input id="f10" value="20" inputmode="decimal" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
    </div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: none">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #BFAE9F">Type</legend>
      <div role="radiogroup" aria-label="Basket type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
        <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Precision</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Standard</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Pressurized</button>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: none">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #BFAE9F">Shot size</legend>
      <div role="radiogroup" aria-label="Shot size" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Single</button>
        <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Double</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Triple</button>
      </div>
    </fieldset>

    <div style="display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 0 10px 0 14px; border-radius: 14px; background: #3E322D">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Diameter</span><span style="font-size: 12px; color: #BFAE9F">Fits none of your machines</span></div>
      <button aria-label="Diameter smaller" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: #54453D; color: #F5EDE3; font-size: 20px">−</button>
      <span style="width: 72px; text-align: center; font-size: 18px; font-weight: 600">58<span style="font-size: 13px; font-weight: 500; color: #BFAE9F"> mm</span></span>
      <button aria-label="Diameter larger" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: #54453D; color: #F5EDE3; font-size: 20px">+</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Dose range</h2>
        <span style="font-size: 12px; color: #BFAE9F">Optional</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D">
          <label for="basket-min" style="font-size: 12px; color: #BFAE9F">From</label>
          <input id="basket-min" inputmode="decimal" value="17.0 g" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D">
          <label for="basket-max" style="font-size: 12px; color: #BFAE9F">To</label>
          <input id="basket-max" inputmode="decimal" value="19.0 g" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
        </div>
      </div>
      <p style="margin: 0 2px; font-size: 12px; line-height: 1.4; color: #BFAE9F">The shot form gives a gentle hint when your dose falls outside this range.</p>
    </div>
  </main>

  <footer style="display: flex; flex-direction: column; gap: 4px; padding: 8px 20px 20px">
    <button style="width: 100%; height: 56px; border-radius: 16px; border: none; background: #E7A955; color: #2A1A08; font-size: 17px; font-weight: 700">Save</button>
    <button style="width: 100%; height: 44px; flex: none; border-radius: 14px; border: none; background: none; color: #BFAE9F; font-size: 15px; font-weight: 600">Archive</button>
  </footer>
</div>
  </div>

  <button aria-label="Close" style="position: absolute; left: 0; top: 0; width: 412px; height: 915px; border: none; padding: 0; background: rgba(18, 12, 10, 0.62)"></button>

  <section aria-label="Archive this basket?" style="position: absolute; left: 0; right: 0; bottom: 0px; height: 300px; box-sizing: border-box; background: #362B27; border-radius: 24px 24px 0 0; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div aria-hidden="true" style="height: 32px; flex: none; display: flex; align-items: center; justify-content: center; margin-bottom: -8px"><div style="width: 40px; height: 5px; border-radius: 3px; background: #6A5850"></div></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 19px; font-weight: 700">Archive this basket?</h2><p style="margin: 0; font-size: 14px; line-height: 1.45; color: #D9CBBE">It leaves the Gear page and the pickers. Past shots keep its name.</p></div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
      <button style="width: 100%; height: 56px; flex: none; border-radius: 16px; border: none; background: #E7A955; color: #2A1A08; font-size: 17px; font-weight: 700">Archive</button>
      <button style="width: 100%; height: 52px; flex: none; border-radius: 14px; border: none; background: #43372F; color: #F5EDE3; font-size: 15px; font-weight: 600">Keep it</button>
    </div>
  </section>
</div>
</body>
</html>
