<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=412">
<title>35 · Edit bean — Delete bean</title>
<!-- Exported from the Coffee Nerd UX canvas. Reference only: do not edit, re-export instead. -->
<style>
@font-face{font-family:'Figtree';font-weight:400;font-style:normal;font-display:block;src:url('fonts/figtree-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:500;font-style:normal;font-display:block;src:url('fonts/figtree-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:600;font-style:normal;font-display:block;src:url('fonts/figtree-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:700;font-style:normal;font-display:block;src:url('fonts/figtree-latin-700-normal.woff2') format('woff2')}

body{margin:0}
a{color:#E7A955}a:hover{color:#F2C78C}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#BFAE9F;opacity:1}

</style>
</head>
<body>
<div style="position: relative; width: 412px; height: 915px; overflow: hidden; background: #2E2522; font-family: 'Figtree', system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #F5EDE3">

  <div style="position: absolute; left: 0; top: 0; width: 412px; height: 915px">
    <div style="width: 412px; height: 915px; box-sizing: border-box; background: #2E2522; color: #F5EDE3; font-family: 'Figtree', system-ui, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column">

  <header style="display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; height: 60px; padding: 0 8px">
    <a href="Beans.dc.html" aria-label="Close without saving" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F5EDE3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 20px; font-weight: 600">Edit bean</h1>
    <span></span>
  </header>

  <form style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 12px; overflow: hidden">

    

    <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D">
      <label for="bean-name" style="display: flex; justify-content: space-between; font-size: 12px; color: #BFAE9F">Name <span>Required</span></label>
      <input id="bean-name" required value="Guji Hambela" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600"/>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D">
      <label for="bean-roaster" style="font-size: 12px; color: #BFAE9F">Roaster</label>
      <input id="bean-roaster" value="Nordlys Roasters" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; min-width: 0"/>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" aria-label="Country, Ethiopia. Tap to choose" style="display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 12px 0 14px; border-radius: 14px; border: none; background: #3E322D; color: #F5EDE3; text-align: left">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; color: #BFAE9F">Country</span>
          <span style="font-size: 16px; font-weight: 600">Ethiopia</span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BFAE9F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D">
        <label for="bean-region" style="font-size: 12px; color: #BFAE9F">Region</label>
        <input id="bean-region" value="Guji" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; min-width: 0"/>
      </div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 6px">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #BFAE9F">Process</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #3E322D; color: #F5EDE3; font-size: 14px; font-weight: 500">Washed</button>
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Natural</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #3E322D; color: #F5EDE3; font-size: 14px; font-weight: 500">Honey</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #3E322D; color: #F5EDE3; font-size: 14px; font-weight: 500">Anaerobic</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #3E322D; color: #F5EDE3; font-size: 14px; font-weight: 500">Other</button>
      </div>
    </fieldset>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D">
        <label for="bean-variety" style="font-size: 12px; color: #BFAE9F">Variety</label>
        <input id="bean-variety" placeholder="e.g. Heirloom" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; min-width: 0"/>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D">
        <label for="bean-altitude" style="font-size: 12px; color: #BFAE9F">Altitude</label>
        <input id="bean-altitude" placeholder="e.g. 1,900–2,100 m" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; min-width: 0"/>
      </div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: none">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #BFAE9F">Roast level</legend>
      <div role="radiogroup" aria-label="Roast level" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
        <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Light</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Med-light</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Medium</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Dark</button>
      </div>
    </fieldset>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; border: none; background: #3E322D; color: #F5EDE3; text-align: left">
        <span style="display: flex; justify-content: space-between; width: 100%; font-size: 12px; color: #BFAE9F">Roast date <span>Required</span></span>
        <span style="font-size: 16px; font-weight: 600">14 Oct</span>
        <span style="font-size: 12px; color: #BFAE9F">2 days ago</span>
      </button>
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D">
        <label for="bean-weight" style="font-size: 12px; color: #BFAE9F">Bag weight</label>
        <input id="bean-weight" inputmode="decimal" placeholder="Optional · g" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; min-width: 0"/>
      </div>
    </div>
  </form>

  <footer style="display: flex; flex-direction: column; gap: 4px; padding: 8px 20px 20px">
    <button style="width: 100%; height: 56px; border-radius: 16px; border: none; background: #E7A955; color: #2A1A08; font-size: 17px; font-weight: 700">Save changes</button>
    <button style="width: 100%; height: 44px; flex: none; border-radius: 14px; border: none; background: none; color: #BFAE9F; font-size: 15px; font-weight: 600">Delete bean</button>
  </footer>
</div>
  </div>

  <button aria-label="Close" style="position: absolute; left: 0; top: 0; width: 412px; height: 915px; border: none; padding: 0; background: rgba(18, 12, 10, 0.62)"></button>

  <section aria-label="Delete this bean?" style="position: absolute; left: 0; right: 0; bottom: 0px; height: 300px; box-sizing: border-box; background: #362B27; border-radius: 24px 24px 0 0; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div aria-hidden="true" style="height: 32px; flex: none; display: flex; align-items: center; justify-content: center; margin-bottom: -8px"><div style="width: 40px; height: 5px; border-radius: 3px; background: #6A5850"></div></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 19px; font-weight: 700">Delete this bean?</h2><p style="margin: 0; font-size: 14px; line-height: 1.45; color: #D9CBBE">It has no shots yet. This cannot be undone.</p></div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
      <button style="width: 100%; height: 56px; flex: none; border-radius: 16px; border: none; background: #E7A955; color: #2A1A08; font-size: 17px; font-weight: 700">Delete bean</button>
      <button style="width: 100%; height: 52px; flex: none; border-radius: 14px; border: none; background: #43372F; color: #F5EDE3; font-size: 15px; font-weight: 600">Keep it</button>
    </div>
  </section>
</div>
</body>
</html>
