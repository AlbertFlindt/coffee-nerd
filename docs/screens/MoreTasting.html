<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=412">
<title>5 · More — Tasting</title>
<!-- Exported from the Coffee Nerd UX canvas. Reference only: do not edit, re-export instead. -->
<style>
@font-face{font-family:'Figtree';font-weight:400;font-style:normal;font-display:block;src:url('fonts/figtree-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:500;font-style:normal;font-display:block;src:url('fonts/figtree-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:600;font-style:normal;font-display:block;src:url('fonts/figtree-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:700;font-style:normal;font-display:block;src:url('fonts/figtree-latin-700-normal.woff2') format('woff2')}

body{margin:0}
a{color:#E7A955}a:hover{color:#F2C78C}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<div style="position: relative; width: 412px; height: 915px; overflow: hidden; background: #2E2522; color: #F5EDE3; font-family: 'Figtree', system-ui, sans-serif; font-variant-numeric: tabular-nums">

  <div style="position: absolute; left: 0; top: 0; width: 412px; height: 915px">
    
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #2E2522; color: #F5EDE3; font-family: 'Figtree', system-ui, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column">

  <header style="display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; height: 60px; padding: 0 8px">
    <button aria-label="Back without saving" style="width: 44px; height: 44px; border: none; background: transparent; color: #F5EDE3; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; text-align: center; font-size: 20px; font-weight: 600">New shot</h1>
    <span></span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 16px">

    <button style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; border: none; background: #3E322D; color: #F5EDE3; text-align: left">
      <div style="display: flex; align-items: center; gap: 12px; width: 100%">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: #F1E6D6; display: flex; align-items: center; justify-content: center; color: #6B4A3A">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(30 12 12)"></ellipse><path d="M9 5.5c3 3 3 10 6 13"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
          <span style="font-size: 16px; font-weight: 600">Ethiopia Guji · Natural</span>
          <span style="font-size: 13px; color: #BFAE9F">Lelit Bianca · Timemore 064S</span>
          <span style="font-size: 13px; color: #BFAE9F">93 °C · 18 g basket · Preinfusion 4 s</span>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BFAE9F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 13px; color: #BFAE9F">
        <span style="display: inline-flex; align-items: center; gap: 6px; color: #E9837A; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #E9837A"></span>Recipe reused 2x</span>
      </div>
    </button>

    <section aria-label="Core values" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="background: #3E322D; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 500; color: #BFAE9F">Grind</span>
        <span style="font-size: 32px; font-weight: 600; line-height: 1.15">1.6</span>
        <div style="display: flex; gap: 8px; margin-top: 4px"><button aria-label="Grind minus 0.1" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #4D3F38; color: #F5EDE3; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">−</span><span style="font-size: 13px; font-weight: 600; color: #D9CBBE">0.1</span></button><button aria-label="Grind plus 0.1" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #4D3F38; color: #F5EDE3; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">+</span><span style="font-size: 13px; font-weight: 600; color: #D9CBBE">0.1</span></button></div>
      </div>
      <div style="background: #3E322D; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 500; color: #BFAE9F">Dose</span>
        <span style="font-size: 32px; font-weight: 600; line-height: 1.15">18.0<span style="font-size: 16px; font-weight: 500; color: #BFAE9F"> g</span></span>
        <div style="display: flex; gap: 8px; margin-top: 4px"><button aria-label="Dose minus 0.1 gram" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #4D3F38; color: #F5EDE3; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">−</span><span style="font-size: 13px; font-weight: 600; color: #D9CBBE">0.1 g</span></button><button aria-label="Dose plus 0.1 gram" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #4D3F38; color: #F5EDE3; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">+</span><span style="font-size: 13px; font-weight: 600; color: #D9CBBE">0.1 g</span></button></div>
      </div>
      <div style="background: #3E322D; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; font-weight: 500; color: #BFAE9F">Yield</span><span style="font-size: 12px; font-weight: 700; color: #22301F; background: #9DCB98; padding: 2px 8px; border-radius: 999px">+2.5</span></div>
        <span style="font-size: 32px; font-weight: 600; line-height: 1.15; color: #9DCB98">38.5<span style="font-size: 16px; font-weight: 500; color: #BFAE9F"> g</span></span>
        <div style="display: flex; gap: 8px; margin-top: 4px"><button aria-label="Yield minus 0.5 gram" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #4D3F38; color: #F5EDE3; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">−</span><span style="font-size: 13px; font-weight: 600; color: rgb(217, 203, 190)">0.1 g</span></button><button aria-label="Yield plus 0.5 gram" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #4D3F38; color: #F5EDE3; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">+</span><span style="font-size: 13px; font-weight: 600; color: rgb(217, 203, 190)">0.1 g</span></button></div>
      </div>
      <div style="background: #3E322D; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; font-weight: 500; color: #BFAE9F">Time</span><span style="font-size: 12px; font-weight: 700; color: #22301F; background: #9DCB98; padding: 2px 8px; border-radius: 999px">−2.5</span></div>
        <span style="font-size: 32px; font-weight: 600; line-height: 1.15; color: #9DCB98">25.5<span style="font-size: 16px; font-weight: 500; color: #BFAE9F"> s</span></span>
        <div style="display: flex; gap: 8px; margin-top: 4px"><button aria-label="Time minus one second" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #4D3F38; color: #F5EDE3; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">−</span><span style="font-size: 13px; font-weight: 600; color: #D9CBBE">1 s</span></button><button aria-label="Time plus one second" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #4D3F38; color: #F5EDE3; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">+</span><span style="font-size: 13px; font-weight: 600; color: #D9CBBE">1 s</span></button></div>
      </div>
    </section>

    <div style="text-align: center; font-size: 14px; color: #BFAE9F; margin-top: -4px">Ratio <span style="color: #9DCB98; font-weight: 600">1 : 2.1</span></div>

    <section aria-label="Taste" style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 16px; font-weight: 600">Balance</h2>
        <span style="font-size: 14px; color: #BFAE9F">Slightly sour</span>
      </div>
      <div role="slider" aria-label="Balance, sour to bitter" aria-valuetext="Slightly sour" tabindex="0" style="position: relative; height: 40px; display: flex; align-items: center">
        <div style="position: absolute; left: 0; right: 0; height: 8px; border-radius: 4px; background: #3E322D"></div>
        <div style="position: absolute; left: 50%; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; background: #6A5850"></div>
        <div style="position: absolute; left: 36%; width: 28px; height: 28px; margin-left: -14px; border-radius: 14px; background: #E7A955; border: 4px solid #2E2522; box-sizing: border-box"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #BFAE9F; margin-top: -6px"><span>Sour</span><span>Balanced</span><span>Bitter</span></div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 600">Score</h2>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #E9837A"><span style="width: 8px; height: 8px; border-radius: 4px; border: 1.5px dashed #E9837A"></span>Last with this recipe: 8</span>
      </div>
      <div role="radiogroup" aria-label="Overall score 1 to 10" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
        <button role="radio" aria-checked="false" style="height: 48px; border-radius: 10px; border: none; background: #3E322D; color: #F5EDE3; font-size: 15px; font-weight: 600">1</button>
        <button role="radio" aria-checked="false" style="height: 48px; border-radius: 10px; border: none; background: #3E322D; color: #F5EDE3; font-size: 15px; font-weight: 600">2</button>
        <button role="radio" aria-checked="false" style="height: 48px; border-radius: 10px; border: none; background: #3E322D; color: #F5EDE3; font-size: 15px; font-weight: 600">3</button>
        <button role="radio" aria-checked="false" style="height: 48px; border-radius: 10px; border: none; background: #3E322D; color: #F5EDE3; font-size: 15px; font-weight: 600">4</button>
        <button role="radio" aria-checked="false" style="height: 48px; border-radius: 10px; border: none; background: #3E322D; color: #F5EDE3; font-size: 15px; font-weight: 600">5</button>
        <button role="radio" aria-checked="false" style="height: 48px; border-radius: 10px; border: none; background: #3E322D; color: #F5EDE3; font-size: 15px; font-weight: 600">6</button>
        <button role="radio" aria-checked="true" style="height: 48px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 15px; font-weight: 700">7</button>
        <button role="radio" aria-checked="false" aria-label="8, last score with this recipe" style="height: 48px; border-radius: 10px; border: 1.5px dashed #E9837A; background: #3E322D; color: #F5EDE3; font-size: 15px; font-weight: 600">8</button>
        <button role="radio" aria-checked="false" style="height: 48px; border-radius: 10px; border: none; background: #3E322D; color: #F5EDE3; font-size: 15px; font-weight: 600">9</button>
        <button role="radio" aria-checked="false" style="height: 48px; border-radius: 10px; border: none; background: #3E322D; color: #F5EDE3; font-size: 15px; font-weight: 600">10</button>
      </div>
    </section>

    <button style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 14px; border: none; background: #3E322D; color: #F5EDE3; font-size: 15px; font-weight: 500">
      More
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BFAE9F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </main>

  <footer style="padding: 8px 20px 28px">
    <button style="width: 100%; height: 56px; border-radius: 16px; border: none; background: #E7A955; color: #2A1A08; font-size: 17px; font-weight: 700">Save shot</button>
  </footer>
</div>

  </div>

  <button aria-label="Close More" style="position: absolute; left: 0; top: 0; width: 412px; height: 823px; border: none; padding: 0; background: rgba(18, 12, 10, 0.62)"></button>

  <section aria-label="More" style="position: absolute; left: 0; right: 0; top: 96px; height: 727px; box-sizing: border-box; background: #362B27; border-radius: 24px 24px 0 0; padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #6A5850"></div>

    <div role="tablist" aria-label="More sections" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #2E2522">
      <button role="tab" aria-selected="false" style="height: 44px; border-radius: 10px; border: none; background: transparent; color: #BFAE9F; font-size: 15px; font-weight: 600">Setup</button>
      <button role="tab" aria-selected="true" style="height: 44px; border-radius: 10px; border: none; background: #F1E6D6; color: #2E2522; font-size: 15px; font-weight: 700">Tasting</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h3 style="margin: 0; font-size: 15px; font-weight: 600">Body</h3><span style="font-size: 13px; color: #BFAE9F">Medium-heavy</span></div>
      <div role="slider" aria-label="Body, light to heavy" aria-valuetext="Medium-heavy" tabindex="0" style="position: relative; height: 40px; display: flex; align-items: center">
        <div style="position: absolute; left: 0; right: 0; height: 8px; border-radius: 4px; background: #2E2522"></div>
        <div style="position: absolute; left: 64%; width: 28px; height: 28px; margin-left: -14px; border-radius: 14px; background: #E7A955; border: 4px solid #362B27; box-sizing: border-box"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #BFAE9F; margin-top: -4px"><span>Light</span><span>Heavy</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h3 style="margin: 0; font-size: 15px; font-weight: 600">Sweetness</h3><span style="font-size: 13px; color: #BFAE9F">High</span></div>
      <div role="slider" aria-label="Sweetness, low to high" aria-valuetext="High" tabindex="0" style="position: relative; height: 40px; display: flex; align-items: center">
        <div style="position: absolute; left: 0; right: 0; height: 8px; border-radius: 4px; background: #2E2522"></div>
        <div style="position: absolute; left: 78%; width: 28px; height: 28px; margin-left: -14px; border-radius: 14px; background: #E7A955; border: 4px solid #362B27; box-sizing: border-box"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #BFAE9F; margin-top: -4px"><span>Low</span><span>High</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h3 style="margin: 0; font-size: 15px; font-weight: 600">Aftertaste</h3><span style="font-size: 13px; color: #BFAE9F">Not set</span></div>
      <div role="slider" aria-label="Aftertaste, short to long" aria-valuetext="Not set" tabindex="0" style="position: relative; height: 40px; display: flex; align-items: center">
        <div style="position: absolute; left: 0; right: 0; height: 8px; border-radius: 4px; background: #2E2522"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #BFAE9F; margin-top: -4px"><span>Short</span><span>Long</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 15px; font-weight: 600">Flavor notes</h3>
      <div role="group" aria-label="Flavor notes" style="display: flex; flex-wrap: wrap; gap: 8px">
        <button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Berry</button>
        <button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Dark chocolate</button>
        <button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #43372F; color: #F5EDE3; font-size: 14px; font-weight: 500">Caramel</button>
        <button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #43372F; color: #F5EDE3; font-size: 14px; font-weight: 500">Citrus</button>
        <button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #43372F; color: #F5EDE3; font-size: 14px; font-weight: 500">Floral</button>
        <button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #43372F; color: #F5EDE3; font-size: 14px; font-weight: 500">Nutty</button>
        <button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #43372F; color: #F5EDE3; font-size: 14px; font-weight: 500">Stone fruit</button>
        <button style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px dashed #6A5850; background: transparent; color: #BFAE9F; font-size: 14px; font-weight: 500">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Add your own
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <label for="shot-notes" style="font-size: 15px; font-weight: 600">Notes</label>
        <span id="notes-hint" style="font-size: 12px; color: #BFAE9F">Just for you · not used in Insights</span>
      </div>
      <textarea id="shot-notes" aria-describedby="notes-hint" placeholder="Anything worth remembering about this shot" style="height: 72px; box-sizing: border-box; padding: 12px 14px; border-radius: 14px; border: none; background: #43372F; color: #F5EDE3; font-family: inherit; font-size: 15px; resize: none"></textarea>
    </div>
  </section>
</div>
</body>
</html>
