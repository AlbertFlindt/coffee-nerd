<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=412">
<title>38 · Gear — New grinder</title>
<!-- Exported from the Coffee Nerd UX canvas. Reference only: do not edit, re-export instead. -->
<style>
@font-face{font-family:'Figtree';font-weight:400;font-style:normal;font-display:block;src:url('fonts/figtree-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:500;font-style:normal;font-display:block;src:url('fonts/figtree-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:600;font-style:normal;font-display:block;src:url('fonts/figtree-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:700;font-style:normal;font-display:block;src:url('fonts/figtree-latin-700-normal.woff2') format('woff2')}

body{margin:0}

</style>

<body>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #2E2522; font-family: 'Figtree', system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #F5EDE3; display: flex; flex-direction: column">
  <header style="display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 4px; height: 60px; flex: none; padding: 0 16px 0 8px">
    <a href="#" aria-label="Close without saving" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F5EDE3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center">New grinder</h1>
    <span></span>
  </header>
  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 12px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px"><label for="f1" style="font-size: 12px; color: #BFAE9F">Name</label></div>
      <input id="f1" placeholder="e.g. Niche Zero" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <fieldset style="margin: 0; padding: 0; border: none; min-width: 0">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #BFAE9F">Type</legend>
      <div role="radiogroup" aria-label="Type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
        <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Electric</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Hand</button>
      </div>
    </fieldset>
      <fieldset style="margin: 0; padding: 0; border: none; min-width: 0">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #BFAE9F">Burrs</legend>
      <div role="radiogroup" aria-label="Burrs" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Flat</button>
        <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Conical</button>
      </div>
    </fieldset>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; min-height: 58px; padding: 0 10px 0 14px; border-radius: 14px; background: #3E322D">
      <span style="flex: 1; font-size: 15px; font-weight: 600">Burr size</span>
      <button aria-label="Burr size smaller" style="width: 44px; height: 44px; flex: none; border-radius: 10px; border: none; background: #54453D; color: #F5EDE3; font-size: 20px">−</button>
      <span style="width: 72px; text-align: center; font-size: 15px; font-weight: 500; color: #BFAE9F">Not set</span>
      <button aria-label="Burr size larger" style="width: 44px; height: 44px; flex: none; border-radius: 10px; border: none; background: #54453D; color: #F5EDE3; font-size: 20px">+</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 4px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">How the dial works</h2>
      <span style="font-size: 13px; color: #BFAE9F">Sets the grind control on the shot form</span>
    </div>
    <fieldset style="margin: 0; padding: 0; border: none; min-width: 0">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Dial</legend>
      <div role="radiogroup" aria-label="Dial" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
        <button type="button" role="radio" aria-checked="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 52px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700"><span style="font-size: 14px; font-weight: 700">Stepped</span><span style="font-size: 12px; color: #2A1A08">clicks or numbers</span></button>
        <button type="button" role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 52px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500"><span style="font-size: 14px; font-weight: 600">Stepless</span><span style="font-size: 12px; color: #BFAE9F">any point on the dial</span></button>
      </div>
    </fieldset>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px"><label for="f2" style="font-size: 12px; color: #BFAE9F">Step interval</label></div>
      <input id="f2" value="1" inputmode="decimal" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
    </div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px"><label for="f3" style="font-size: 12px; color: #BFAE9F">Finest</label></div>
      <input id="f3" value="0" inputmode="decimal" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
    </div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px"><label for="f4" style="font-size: 12px; color: #BFAE9F">Coarsest</label></div>
      <input id="f4" value="0" inputmode="decimal" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
    </div>
    </div>
    <p style="margin: 0 2px; font-size: 12px; line-height: 1.4; color: #BFAE9F">Step interval is how much − or + moves the grind.</p>
    <section aria-label="Preview" style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 15px; font-weight: 600">Preview</h2><span style="font-size: 12px; color: #BFAE9F">Shot form › Grind</span></div>
      <div aria-hidden="true" style="display: flex; padding: 10px; border-radius: 18px; border: 1.5px dashed #6A5850">
        <div style="width: 180px; display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: #3E322D">
          <span style="font-size: 12px; color: #BFAE9F">Grind</span>
          <span style="font-size: 26px; font-weight: 600; line-height: 1.15">0</span>
          <div style="display: flex; gap: 6px; margin-top: 2px"><span style="flex: 1; height: 40px; border-radius: 10px; background: #4D3F38; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">−</span><span style="font-size: 13px; font-weight: 600; color: #D9CBBE">1</span></span><span style="flex: 1; height: 40px; border-radius: 10px; background: #4D3F38; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">+</span><span style="font-size: 13px; font-weight: 600; color: #D9CBBE">1</span></span></div>
        </div>
        <span style="flex: 1; align-self: center; padding: 0 12px; font-size: 12px; line-height: 1.5; color: #BFAE9F">Range 0–0</span>
      </div>
    </section>
  </main>
  <footer style="display: flex; flex-direction: column; gap: 8px; flex: none; padding: 8px 20px 28px">
    <p role="alert" style="margin: 0; text-align: center; font-size: 13px; line-height: 1.4; color: #D9CBBE">Finest and coarsest must differ</p>
    <button style="width: 100%; height: 56px; flex: none; border-radius: 16px; border: none; background: #E7A955; color: #2A1A08; font-size: 17px; font-weight: 700">Add grinder</button>
  </footer>
</div>
</body>
</html>
