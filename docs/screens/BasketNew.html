<html lang="en">
<head>
<meta charset="utf-8">

<style>
@font-face{font-family:'Figtree';font-weight:400;font-style:normal;font-display:block;src:url('fonts/figtree-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:500;font-style:normal;font-display:block;src:url('fonts/figtree-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:600;font-style:normal;font-display:block;src:url('fonts/figtree-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:700;font-style:normal;font-display:block;src:url('fonts/figtree-latin-700-normal.woff2') format('woff2')}

body{margin:0}

</style>

<body>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #2E2522; font-family: 'Figtree', system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #F5EDE3; display: flex; flex-direction: column">
  <header style="display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 4px; height: 60px; flex: none; padding: 0 16px 0 8px">
    <a href="#" aria-label="Close without saving" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F5EDE3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center">New basket</h1>
    <span></span>
  </header>
  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 12px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px"><label for="f5" style="font-size: 12px; color: #BFAE9F">Brand</label></div>
      <input id="f5" value="IMS" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
    </div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px"><label for="f6" style="font-size: 12px; color: #BFAE9F">Size</label><span style="font-size: 12px; color: #BFAE9F">g</span></div>
      <input id="f6" value="20" placeholder="e.g. 18" inputmode="decimal" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
    </div>
    </div>
    <p style="margin: 0 2px; font-size: 12px; line-height: 1.4; color: #BFAE9F; margin-top: -6px">Size is the grams the basket is made for. It names the basket, like VST · 18 g.</p>
    <fieldset style="margin: 0; padding: 0; border: none; min-width: 0">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #BFAE9F">Type</legend>
      <div role="radiogroup" aria-label="Type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
        <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Precision</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Standard</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Pressurized</button>
      </div>
    </fieldset>
    <fieldset style="margin: 0; padding: 0; border: none; min-width: 0">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #BFAE9F">Shot size</legend>
      <div role="radiogroup" aria-label="Shot size" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Single</button>
        <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Double</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Triple</button>
      </div>
    </fieldset>
    <div style="display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 0 10px 0 14px; border-radius: 14px; background: #3E322D">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Diameter</span><span style="font-size: 12px; color: #BFAE9F">Fits none of your machines</span></div>
      <button aria-label="Diameter smaller" style="width: 44px; height: 44px; flex: none; border-radius: 10px; border: none; background: #54453D; color: #F5EDE3; font-size: 20px">−</button>
      <span style="width: 72px; text-align: center; font-size: 20px; font-weight: 600; color: #F5EDE3">54<span style="font-size: 13px; font-weight: 500; color: #BFAE9F"> mm</span></span>
      <button aria-label="Diameter larger" style="width: 44px; height: 44px; flex: none; border-radius: 10px; border: none; background: #54453D; color: #F5EDE3; font-size: 20px">+</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 15px; font-weight: 600">Dose range</h2><span style="font-size: 12px; color: #BFAE9F">Optional</span></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px"><label for="f7" style="font-size: 12px; color: #BFAE9F">From</label></div>
      <input id="f7" value="21.0 g" inputmode="decimal" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
    </div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D; min-width: 0">
      <div style="display: flex; justify-content: space-between; gap: 8px"><label for="f8" style="font-size: 12px; color: #BFAE9F">To</label></div>
      <input id="f8" value="19.0 g" inputmode="decimal" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
    </div>
    </div>
      <p style="margin: 0 2px; font-size: 12px; line-height: 1.4; color: #BFAE9F">The shot form gives a gentle hint when your dose falls outside this range.</p>
    </div>
  </main>
  <footer style="display: flex; flex-direction: column; gap: 8px; flex: none; padding: 8px 20px 28px">
    <p role="alert" style="margin: 0; text-align: center; font-size: 13px; line-height: 1.4; color: #D9CBBE">The dose range must run from low to high</p>
    <button style="width: 100%; height: 56px; flex: none; border-radius: 16px; border: none; background: #E7A955; color: #2A1A08; font-size: 17px; font-weight: 700">Add basket</button>
  </footer>
</div>
