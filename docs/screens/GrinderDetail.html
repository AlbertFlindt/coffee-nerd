<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=412">
<title>15 · Gear — Grinder detail</title>
<!-- Exported from the Coffee Nerd UX canvas. Reference only: do not edit, re-export instead. -->
<style>
@font-face{font-family:'Figtree';font-weight:400;font-style:normal;font-display:block;src:url('fonts/figtree-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:500;font-style:normal;font-display:block;src:url('fonts/figtree-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:600;font-style:normal;font-display:block;src:url('fonts/figtree-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-weight:700;font-style:normal;font-display:block;src:url('fonts/figtree-latin-700-normal.woff2') format('woff2')}

body{margin:0}
a{color:#E7A955}a:hover{color:#F2C78C}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #2E2522; color: #F5EDE3; font-family: 'Figtree', system-ui, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column">

  <header style="display: grid; grid-template-columns: 48px 1fr auto; align-items: center; height: 60px; padding: 0 16px 0 8px">
    <a href="Equipment.html" aria-label="Back to Gear" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F5EDE3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 600">Grinder</h1>
    <span style="font-size: 12px; font-weight: 700; color: #2E2522; background: #F1E6D6; padding: 3px 8px; border-radius: 999px">Default</span>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 12px; overflow: hidden">

    <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; border-radius: 14px; background: #3E322D">
      <label for="grinder-name" style="font-size: 12px; color: #BFAE9F">Name</label>
      <input id="grinder-name" value="Timemore Sculptor 064S" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600"/>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <fieldset style="margin: 0; padding: 0; border: none; min-width: 0">
        <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #BFAE9F">Type</legend>
        <div role="radiogroup" aria-label="Grinder type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
          <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Electric</button>
          <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Hand</button>
        </div>
      </fieldset>
      <fieldset style="margin: 0; padding: 0; border: none; min-width: 0">
        <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; color: #BFAE9F">Burrs</legend>
        <div role="radiogroup" aria-label="Burr shape" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
          <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08; font-size: 14px; font-weight: 700">Flat</button>
          <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3; font-size: 14px; font-weight: 500">Conical</button>
        </div>
      </fieldset>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; min-height: 58px; padding: 0 10px 0 14px; border-radius: 14px; background: #3E322D">
      <span style="flex: 1; font-size: 15px; font-weight: 600">Burr size</span>
      <button aria-label="Burr size smaller" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: #54453D; color: #F5EDE3; font-size: 20px">−</button>
      <span style="width: 72px; text-align: center; font-size: 18px; font-weight: 600">64<span style="font-size: 13px; font-weight: 500; color: #BFAE9F"> mm</span></span>
      <button aria-label="Burr size larger" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: #54453D; color: #F5EDE3; font-size: 20px">+</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 4px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">How the dial works</h2>
      <span style="font-size: 13px; color: #BFAE9F">Sets the grind control on the shot form</span>
    </div>

    <fieldset style="margin: 0; padding: 0; border: none">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Dial</legend>
      <div role="radiogroup" aria-label="Dial" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #3E322D">
        <button type="button" role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 52px; border-radius: 10px; border: none; background: transparent; color: #F5EDE3"><span style="font-size: 14px; font-weight: 600">Stepped</span><span style="font-size: 12px; color: #BFAE9F">clicks or numbers</span></button>
        <button type="button" role="radio" aria-checked="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 52px; border-radius: 10px; border: none; background: #E7A955; color: #2A1A08"><span style="font-size: 14px; font-weight: 700">Stepless</span><span style="font-size: 12px">any point on the dial</span></button>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 2px; border-radius: 14px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 0 10px 0 14px; background: #3E322D">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Step per tap</span><span style="font-size: 12px; color: #BFAE9F">How much − or + moves</span></div>
        <button aria-label="Smaller step" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: #54453D; color: #F5EDE3; font-size: 20px">−</button>
        <span style="width: 60px; text-align: center; font-size: 18px; font-weight: 600">0.1</span>
        <button aria-label="Larger step" style="width: 44px; height: 44px; border-radius: 10px; border: none; background: #54453D; color: #F5EDE3; font-size: 20px">+</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px">
        <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; background: #3E322D">
          <label for="grinder-min" style="font-size: 12px; color: #BFAE9F">Finest</label>
          <input id="grinder-min" inputmode="decimal" value="0.0" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-height: 56px; justify-content: center; padding: 0 14px; background: #3E322D">
          <label for="grinder-max" style="font-size: 12px; color: #BFAE9F">Coarsest</label>
          <input id="grinder-max" inputmode="decimal" value="16.0" style="border: none; padding: 0; background: transparent; color: #F5EDE3; font-family: inherit; font-size: 16px; font-weight: 600; min-width: 0"/>
        </div>
      </div>
    </div>

    <section aria-label="Preview" style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h3 style="margin: 0; font-size: 15px; font-weight: 600">Preview</h3>
        <span style="font-size: 12px; color: #BFAE9F">Shot form › Grind</span>
      </div>
      <div aria-hidden="true" style="display: flex; padding: 10px; border-radius: 18px; border: 1.5px dashed #6A5850">
        <div style="width: 180px; display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: #3E322D">
          <span style="font-size: 12px; color: #BFAE9F">Grind</span>
          <span style="font-size: 26px; font-weight: 600; line-height: 1.15">1.6</span>
          <div style="display: flex; gap: 6px; margin-top: 2px"><span style="flex: 1; height: 40px; border-radius: 10px; background: #4D3F38; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">−</span><span style="font-size: 13px; font-weight: 600; color: #D9CBBE">0.1</span></span><span style="flex: 1; height: 40px; border-radius: 10px; background: #4D3F38; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 20px; line-height: 1">+</span><span style="font-size: 13px; font-weight: 600; color: #D9CBBE">0.1</span></span></div>
        </div>
        <span style="flex: 1; align-self: center; padding: 0 12px; font-size: 12px; line-height: 1.5; color: #BFAE9F">Range 0.0–16.0</span>
      </div>
    </section>
  </main>

  <footer style="padding: 8px 20px 28px">
    <button style="width: 100%; height: 56px; border-radius: 16px; border: none; background: #E7A955; color: #2A1A08; font-size: 17px; font-weight: 700">Save</button>
  </footer>
</div>
</body>
</html>
